[project]
name = "aspace-wb-scripts"
version = "0.3.1"
description = "Scripts to aid American Philosophical Society (APS) staff in preparing CSV files for ingesting files into Islandora 8 using Workbench"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "American Philosophical Society", email = "cds@amphilsoc.org"},
    {name = "Paul Sutherland", email = "psutherland@amphilsoc.org"},
    {name = "David Ragnar Nelson", email = "dnelson@amphilsoc.org"},
    {name = "Yumi Dineen Shiroma", email = "yshiroma@amphilsoc.org"}
]
maintainers = [
    {name = "American Philosophical Society", email = "cds@amphilsoc.org"}
]
keywords = ["archivesspace", "islandora", "workbench", "metadata", "digital-library"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.11"
dependencies = [
    "loc-authorities>=0.4.0",
    "openpyxl>=3.1.5",
    "pandas>=3.1.1",
    "pypdf>=7.1.0",
    "xlsxwriter>=3.3.1",
]

[project.urls]
Homepage = "https://github.com/americanphilosophicalsociety/aspace-wb-scripts"
Repository = "https://github.com/americanphilosophicalsociety/aspace-wb-scripts"
Issues = "https://github.com/americanphilosophicalsociety/aspace-wb-scripts/issues"

[project.scripts]
wb-fillable = "aspace_wb.cli.create_fillable:main"
wb-validate = "aspace_wb.cli.validate_filled:main"
wb-to-wb = "aspace_wb.cli.filled_to_wb:main"
wb-create-dos = "aspace_wb.cli.create_aspace_dos:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aspace_wb"]
